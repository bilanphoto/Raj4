:root{

    linear-gradient(160deg,var(--bg-1),var(--bg-2));background-attachment:fixed;}
header{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.2) blur(10px);

.brand-text h1{font-family:'Kanit',sans-serif;font-weight:700;font-size:1.25rem;line-height:1;}
.brand-text p{font-size:.78rem;color:var(--ink-soft);margin-top:3px;}
.gear{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);
  background:#fff;cursor:pointer;display:grid;place-items:center;transition:.15s;}
.gear:hover{border-color:var(--green-line);background:var(--green-soft);}
.gear svg{width:21px;height:21px;stroke:var(--ink-soft);}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 100px;}
.card{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.card h3{font-family:'Kanit',sans-serif;font-weight:600;font-size:1.05rem;margin-bottom:12px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:5px;}
input[type=text],input[type=url],input[type=search]{width:100%;font-family:'Sarabun',sans-serif;font-size:1rem;
  padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none;transition:.15s;}
input:focus{border-color:var(--green-line);box-shadow:0 0 0 3px var(--green-soft);}
.btn{font-family:'Kanit',sans-serif;font-weight:500;font-size:.98rem;border-radius:12px;
  padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s;width:100%;}
.btn:hover{border-color:var(--green-line);color:var(--green);}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green);}
.btn.primary:hover{background:#27572f;color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;}
.row .btn{width:auto;flex:1;}
.hint{font-size:.8rem;color:var(--ink-soft);line-height:1.55;margin-top:8px;}
.me-pill{display:inline-flex;align-items:center;gap:8px;background:var(--green-soft);border:1px solid var(--green-line);
  color:var(--green);font-family:'Kanit',sans-serif;font-weight:500;padding:7px 13px;border-radius:999px;font-size:.9rem;}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;
  font-family:'Kanit',sans-serif;font-weight:500;padding:11px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(47,107,61,.35);
  opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:.95rem;text-align:center;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#b3261e;box-shadow:0 8px 24px rgba(179,38,30,.35);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(238,241,236,.95);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;}
.tabbar button{flex:1;background:none;border:none;padding:11px 0 13px;cursor:pointer;color:var(--ink-soft);
  font-family:'Kanit',sans-serif;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:4px;}
.tabbar button svg{width:23px;height:23px;stroke:var(--ink-soft);fill:none;stroke-width:1.8;}
.tabbar button.active{color:var(--green);}
.tabbar button.active svg{stroke:var(--green);}
.view{display:none;} .view.active{display:block;}
.dropzone{border:2px dashed var(--green-line);border-radius:14px;background:var(--green-soft);
  padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;}
.dropzone:hover{background:#dcebdb;}
.dropzone svg{width:38px;height:38px;stroke:var(--green);stroke-width:1.6;fill:none;margin-bottom:8px;}
.dropzone p{font-family:'Kanit',sans-serif;color:var(--green);font-weight:500;}
.preview{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:none;}
.preview img{width:100%;display:block;}
.slip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:520px){.slip-grid{grid-template-columns:repeat(3,1fr);}}
.slip{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);
  text-decoration:none;color:inherit;display:block;transition:.15s;}
.slip:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.slip .thumb{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f0f3ee;display:block;}
.slip .meta{padding:8px 10px;font-size:.78rem;color:var(--ink-soft);}
.slip .meta b{display:block;color:var(--ink);font-family:'Kanit',sans-serif;font-weight:500;font-size:.85rem;}
.empty{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:.95rem;}
.empty svg{width:46px;height:46px;stroke:var(--green-line);stroke-width:1.4;fill:none;margin-bottom:10px;}
.spin{width:30px;height:30px;border:3px solid var(--green-line);border-top-color:var(--green);border-radius:50%;
  animation:sp 1s linear infinite;margin:30px auto;}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---- admin grid ---- */
.adm-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}
@media(min-width:520px){.adm-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:760px){.adm-grid{grid-template-columns:repeat(4,1fr);}}

.house.has .badge{background:var(--green);}
/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(36,48,36,.5);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;}
.modal.show{display:flex;}
@media(min-width:560px){.modal{align-items:center;}}
.sheet{background:var(--bg-1);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.25);}
@media(min-width:560px){.sheet{border-radius:20px;}}
.sheet-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.sheet-top h3{font-family:'Kanit',sans-serif;font-weight:600;font-size:1.15rem;}
.sheet-top .close{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:1.1rem;color:var(--ink-soft);}

.head-inner{max-width:1100px;} .wrap{max-width:1100px;}
/* login gate */
.gate{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1000px 500px at 50% -10%,#f6f8f4,transparent 60%),linear-gradient(160deg,var(--bg-1),var(--bg-2));}
.gate-card{width:100%;max-width:360px;background:rgba(255,255,255,.85);border:1px solid var(--line);
  border-radius:18px;padding:26px 22px;box-shadow:var(--shadow);text-align:center;}

.gate-card h2{font-family:'Kanit',sans-serif;font-weight:600;font-size:1.25rem;margin-bottom:4px;}
.gate-card p{color:var(--ink-soft);font-size:.85rem;margin-bottom:18px;}
.gate-card input{text-align:center;font-size:1.1rem;letter-spacing:2px;margin-bottom:12px;}
.linkbtn{background:none;border:none;color:var(--green);font-family:'Kanit',sans-serif;font-size:.85rem;cursor:pointer;margin-top:14px;text-decoration:underline;}
#app{display:none;}
/* change-password modal (redesigned) */
.pwd-modal .sheet{max-width:400px;padding:0;overflow:hidden;animation:pwdIn .28s cubic-bezier(.2,.9,.3,1);}
@keyframes pwdIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.pwd-head{position:relative;text-align:center;padding:28px 24px 20px;
  background:radial-gradient(120% 110% at 50% 0,#e9f3e7 0%,transparent 72%);}
.pwd-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:#fff;cursor:pointer;color:var(--ink-soft);font-size:1rem;line-height:1;display:grid;place-items:center;transition:.15s;}
.pwd-x:hover{border-color:var(--green-line);color:var(--green);}
.pwd-icon{width:62px;height:62px;border-radius:19px;margin:0 auto 13px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--green),#3f8a50);box-shadow:0 10px 22px rgba(47,107,61,.32);}
.pwd-icon svg{width:29px;height:29px;stroke:#fff;fill:none;stroke-width:2;}
.pwd-head h3{font-family:'Kanit',sans-serif;font-weight:600;font-size:1.22rem;color:var(--ink);}
.pwd-head p{font-size:.85rem;color:var(--ink-soft);margin-top:4px;}
.pwd-body{padding:4px 24px 24px;}
.pwd-input{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:0 12px;margin-bottom:11px;transition:.15s;}
.pwd-input:focus-within{border-color:var(--green-line);box-shadow:0 0 0 3px var(--green-soft);}
.pwd-input .ic{width:19px;height:19px;stroke:var(--ink-soft);fill:none;stroke-width:1.8;flex:0 0 auto;}
.pwd-input:focus-within .ic{stroke:var(--green);}
.pwd-input input{flex:1;border:none;outline:none;background:none;padding:13px 0;font-family:'Sarabun',sans-serif;font-size:1rem;color:var(--ink);}
.pwd-input input:focus{box-shadow:none;border:none;}
.pwd-eye{border:none;background:none;cursor:pointer;padding:5px;display:grid;place-items:center;color:#b6c0b3;flex:0 0 auto;transition:.15s;}
.pwd-eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.pwd-eye:hover{color:var(--green);}
.pwd-eye.on{color:var(--green);}
.pwd-msg{font-size:.85rem;min-height:1.2em;margin:6px 2px 12px;text-align:center;color:var(--ink-soft);}
.pwd-actions{display:flex;gap:10px;}
.pwd-actions .btn{width:auto;flex:1;}
.pwd-actions .btn.primary{flex:1.7;}
</style></head><body>

<!-- ====== หน้าใส่รหัสผ่าน ====== -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="lock"></div>
    <h2>เข้าสู่ระบบแอดมิน</h2>
    <p>กรุณากรอกรหัสผ่าน</p>
    <input type="password" id="gatePass" placeholder="รหัสผ่าน" autocomplete="current-password">
    <button class="btn primary" id="gateBtn">เข้าสู่ระบบ</button>
    <div id="gateMsg" style="color:#b3261e;font-size:.85rem;margin-top:10px;min-height:1em"></div>
  </div>
</div>

<!-- ====== แอปจริง (ซ่อนจนกว่าจะล็อกอิน) ====== -->
<div id="app">
<header><div class="head-inner">

  <div class="brand-text"><h1>ราชพฤกษ์ 4 · แอดมิน</h1><p id="sub">บ้านที่ลงทะเบียนแล้ว</p></div>
  <button class="gear" id="qrCfgBtn" aria-label="ตั้งค่า QR" title="ตั้งค่า QR / จำนวนเงิน">

  </button>
  <button class="gear" id="pwdBtn" aria-label="เปลี่ยนรหัสผ่าน" title="เปลี่ยนรหัสผ่าน" style="margin-left:8px">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:21px;height:21px;stroke:var(--ink-soft)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

  </button>
</div></header>

<div class="wrap">
  <div style="margin:0 0 14px"><input type="search" id="searchHouse" placeholder="🔍 ค้นหาบ้านเลขที่ หรือ ชื่อ"></div>

</div>
</div>

  <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">

  </div>
</div></div>

    </label>
    <label class="pwd-input">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <input type="text" id="cfgAmount" placeholder="จำนวนเงิน (บาท) — เว้นว่างได้" inputmode="decimal">
    </label>
    <div style="text-align:center;margin:8px 0 4px">
      <img id="cfgPreview" alt="พรีวิว QR" style="width:170px;max-width:60%;border-radius:12px;border:1px solid var(--line);background:#fff;display:none">
      <div id="cfgPreviewEmpty" class="pwd-msg">กรอกหมายเลขเพื่อดูพรีวิว QR</div>
    </div>
    <div id="cfgMsg" class="pwd-msg"></div>
    <div class="pwd-actions">
      <button class="btn" id="cfgCancel">ยกเลิก</button>
      <button class="btn primary" id="cfgSave">ยืนยัน</button>
    </div>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>

// ===================================================================
//  ⬇️ ใส่ URL ของ API (Apps Script /exec) ตรงนี้ที่เดียว ⬇️
const API_URL = 'https://script.google.com/macros/s/AKfycbx5UZgqFUUe1YM3hNcuNdhK7bFeperD-23cR2bQu-Ak2E59b0571lB1RwysGigphRIbMA/exec';
// ===================================================================
const API={
  url(){return API_URL;},
  async get(params){
    return new Promise((resolve,reject)=>{
      if(!this.url())return reject(new Error('ยังไม่ได้ตั้งค่า URL ของ API'));
      let u; try{u=new URL(this.url());}catch(e){return reject(new Error('URL ไม่ถูกต้อง'));}
      const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
      Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
      u.searchParams.set('callback',cb);
      const s=document.createElement('script');
      const timer=setTimeout(()=>{cleanup();reject(new Error('หมดเวลาเชื่อมต่อ'));},20000);
      function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(e){}s.remove();}
      window[cb]=data=>{cleanup();resolve(data);};
      s.onerror=()=>{cleanup();reject(new Error('เชื่อมต่อไม่สำเร็จ'));};
      s.src=u.toString(); document.body.appendChild(s);
    });
  },
  async post(body){
    if(!this.url()) throw new Error('ยังไม่ได้ตั้งค่า URL ของ API');
    await fetch(this.url(),{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    return {ok:true}; // no-cors อ่านผลลัพธ์ไม่ได้ ถือว่าส่งสำเร็จ
  }
};
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast show'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast',2200);}
function fmtTime(iso){if(!iso)return'';const d=new Date(iso);
  return d.toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});}
// ย่อรูปก่อนอัปโหลดให้ไฟล์เล็กลง
function fileToDataUrl(file,maxW=1280,q=0.82){return new Promise((res,rej)=>{
  const img=new Image();const fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{
    let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',q));
  };img.onerror=rej;img.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);});}

const board=document.getElementById('board');
let currentHouse=null, currentName=null;

async function loadBoard(){
  if(!API.url()){board.innerHTML='<div class="empty">ยังไม่ได้ใส่ URL ของ API ในโค้ด<br>(แก้ค่า API_URL ในไฟล์ admin.html)</div>';return;}
  board.innerHTML='<div class="spin"></div>';
  try{
    const r=await API.get({action:'getHouses'});
    const houses=r.houses||[];
    const month=r.month||'';
    document.getElementById('sub').textContent=(month?('เดือน '+month+' · '):'')+'ลงทะเบียน '+houses.length+' หลัง';
    if(!houses.length){board.innerHTML='<div class="empty">'+`<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>`+'<div>ยังไม่มีผู้ใช้ลงทะเบียน</div></div>';return;}
    board.innerHTML='<div class="adm-grid">'+houses.map(h=>
      `<button class="house ${h.slips>0?'has':''}" data-house="${h.house}" data-name="${(h.name||'').replace(/"/g,'&quot;')}">
        <span class="badge">${h.slips>0?('จ่ายแล้ว'+(h.slips>1?(' '+h.slips):'')):'ยังไม่จ่าย'}</span>
        <span class="info"><span class="h">บ้านเลขที่ ${h.house}</span><span class="n">${h.name||'-'}</span></span>
      </button>`).join('')+'</div>';
    applyHouseFilter();
  }catch(e){board.innerHTML='<div class="empty">โหลดไม่สำเร็จ<br>'+e.message+'</div>';}
}

// click house -> show slips
board.addEventListener('click',async e=>{
  const el=e.target.closest('.house');if(!el)return;
  const house=el.dataset.house,name=el.dataset.name;
  currentHouse=house; currentName=name;
  openModal('บ้านเลขที่ '+house+(name?(' · '+name):''));
  try{
    const r=await API.get({action:'getSlips',house});
    const list=r.slips||[];
    if(!list.length){mBody.innerHTML='<div class="empty">'+`<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>`+'<div>ยังไม่มีสลิปสำหรับบ้านหลังนี้</div></div>';return;}
    mBody.innerHTML='<div class="slip-grid">'+list.map(s=>
      `<a class="slip" href="https://drive.google.com/file/d/${s.fileId}/view" target="_blank" rel="noopener">
        <img class="thumb" src="${s.url}" loading="lazy" alt="สลิป">
        <div class="meta"><b>${s.name||'-'}</b>${fmtTime(s.time)}</div></a>`).join('')+'</div>';
  }catch(err){mBody.innerHTML='<div class="empty">โหลดไม่สำเร็จ<br>'+err.message+'</div>';}
});

function openModal(t){document.getElementById('mTitle').textContent=t;mBody.innerHTML='<div class="spin"></div>';modal.classList.add('show');}
document.getElementById('mClose').onclick=()=>modal.classList.remove('show');
document.getElementById('delHouse').onclick=async()=>{
  if(!currentHouse)return;
  if(!confirm('ลบบ้านเลขที่ '+currentHouse+' ?\nข้อมูลผู้ใช้และสลิปทั้งหมดของบ้านหลังนี้จะถูกลบ'))return;
  try{ const r=await API.get({action:'deleteHouse',house:currentHouse,token:getToken()});
    if(r&&r.ok){modal.classList.remove('show');toast('ลบบ้านเลขที่ '+currentHouse+' แล้ว');setTimeout(loadBoard,500);}
    else if(r&&/token|อนุญาต/.test(r.error||'')){toast(r.error,true);needRelogin();}
    else toast((r&&r.error)||'ลบไม่สำเร็จ',true);
  }catch(e){toast('ลบไม่สำเร็จ: '+e.message,true);}
};
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show');});

document.getElementById('refreshBtn').onclick=loadBoard;

// ====== ตั้งค่า QR พร้อมเพย์ ======
const qrCfgModal=document.getElementById('qrCfgModal');
function cfgQrUrl(){
  const num=(document.getElementById('cfgQR').value||'').trim();
  const amt=(document.getElementById('cfgAmount').value||'').trim();
  if(!num) return '';
  return 'https://promptpay.io/'+encodeURIComponent(num)+(amt?('/'+encodeURIComponent(amt)):'')+'.png';
}
function updatePreview(){
  const url=cfgQrUrl();
  const img=document.getElementById('cfgPreview'),empty=document.getElementById('cfgPreviewEmpty');
  if(url){img.src=url;img.style.display='inline-block';empty.style.display='none';}
  else{img.style.display='none';empty.style.display='block';}
}
let cfgTimer=null;
['cfgQR','cfgAmount'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{
  clearTimeout(cfgTimer);cfgTimer=setTimeout(updatePreview,400);
}));
async function openQRCfg(){
  document.getElementById('cfgMsg').textContent='';
  qrCfgModal.classList.add('show');
  try{
    const r=await API.get({action:'getConfig'});
    const c=(r&&r.config)||{};
    document.getElementById('cfgQR').value=c.promptpay||'';
    document.getElementById('cfgAmount').value=c.amount||'';
  }catch(e){}
  updatePreview();
}
document.getElementById('qrCfgBtn').onclick=openQRCfg;
document.getElementById('cfgClose').onclick=()=>qrCfgModal.classList.remove('show');
document.getElementById('cfgCancel').onclick=()=>qrCfgModal.classList.remove('show');
qrCfgModal.addEventListener('click',e=>{if(e.target===qrCfgModal)qrCfgModal.classList.remove('show');});
document.getElementById('cfgSave').onclick=async()=>{
  const promptpay=(document.getElementById('cfgQR').value||'').trim();
  const amount=(document.getElementById('cfgAmount').value||'').trim();
  const msg=document.getElementById('cfgMsg');
  if(!promptpay){msg.style.color='#b3261e';msg.textContent='กรุณากรอกหมายเลขพร้อมเพย์';return;}
  msg.style.color='var(--ink-soft)';msg.textContent='กำลังบันทึก...';
  try{
    const r=await API.get({action:'setConfig',promptpay,amount,token:getToken()});
    if(r&&r.ok){msg.style.color='var(--green)';msg.textContent='บันทึกแล้ว ✓';
      toast('ตั้งค่า QR เรียบร้อย');setTimeout(()=>qrCfgModal.classList.remove('show'),900);}
    else if(r&&/token|อนุญาต/.test(r.error||'')){qrCfgModal.classList.remove('show');needRelogin();}
    else{msg.style.color='#b3261e';msg.textContent=(r&&r.error)||'บันทึกไม่สำเร็จ';}
  }catch(e){msg.style.color='#b3261e';msg.textContent='เชื่อมต่อไม่ได้: '+e.message;}
};

// ====== ค้นหาบ้านเลขที่ / ชื่อ ======
function applyHouseFilter(){
  const q=(document.getElementById('searchHouse').value||'').trim().toLowerCase();
  const cards=board.querySelectorAll('.house');
  let shown=0;
  cards.forEach(c=>{
    const hay=(c.dataset.house+' '+(c.dataset.name||'')).toLowerCase();
    const ok=!q||hay.includes(q);
    c.style.display=ok?'':'none';
    if(ok)shown++;
  });
  let note=document.getElementById('noFound');
  if(cards.length&&shown===0){
    if(!note){note=document.createElement('div');note.id='noFound';note.className='empty';
      note.textContent='ไม่พบบ้านที่ค้นหา';board.appendChild(note);}
  } else if(note){note.remove();}
}
document.getElementById('searchHouse').addEventListener('input',applyHouseFilter);

// ====== ระบบล็อกอิน ======
const gate=document.getElementById('gate'),app=document.getElementById('app');
function getToken(){return sessionStorage.getItem('rp4_admin_token')||'';}
function enterApp(){gate.style.display='none';app.style.display='block';loadBoard();}
function needRelogin(){sessionStorage.removeItem('rp4_admin_token');app.style.display='none';gate.style.display='flex';
  const m=document.getElementById('gateMsg');m.style.color='#b3261e';m.textContent='เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';}

async function doLogin(){
  const pass=document.getElementById('gatePass').value;
  const msg=document.getElementById('gateMsg');
  if(!pass){msg.textContent='กรุณากรอกรหัสผ่าน';return;}
  msg.style.color='var(--ink-soft)';msg.textContent='กำลังตรวจสอบ...';
  try{
    const r=await API.get({action:'checkPassword',password:pass});
    if(r&&r.valid){sessionStorage.setItem('rp4_admin_token',r.token||'');msg.textContent='';enterApp();}
    else{msg.style.color='#b3261e';msg.textContent='รหัสผ่านไม่ถูกต้อง';}
  }catch(e){msg.style.color='#b3261e';msg.textContent='เชื่อมต่อไม่ได้: '+e.message;}
}
document.getElementById('gateBtn').onclick=doLogin;
document.getElementById('gatePass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ====== modal เปลี่ยนรหัสผ่าน ======
const pwdModal=document.getElementById('pwdModal');
function openPwd(){
  ['curPass','newPass','newPass2'].forEach(id=>{const i=document.getElementById(id);i.value='';i.type='password';});
  document.querySelectorAll('.pwd-eye').forEach(b=>b.classList.remove('on'));
  const m=document.getElementById('pwdMsg');m.textContent='';m.style.color='';
  pwdModal.classList.add('show');
}
document.querySelectorAll('.pwd-eye').forEach(btn=>btn.onclick=()=>{
  const inp=document.getElementById(btn.dataset.for);
  inp.type = inp.type==='password' ? 'text' : 'password';
  btn.classList.toggle('on', inp.type==='text');
});
document.getElementById('pwdBtn').onclick=openPwd;
document.getElementById('pwdClose').onclick=()=>pwdModal.classList.remove('show');
document.getElementById('pwdCancel').onclick=()=>pwdModal.classList.remove('show');
pwdModal.addEventListener('click',e=>{if(e.target===pwdModal)pwdModal.classList.remove('show');});
document.getElementById('pwdSave').onclick=async()=>{
  const cur=document.getElementById('curPass').value;
  const nw=document.getElementById('newPass').value;
  const nw2=document.getElementById('newPass2').value;
  const msg=document.getElementById('pwdMsg');
  if(!cur||!nw){msg.style.color='#b3261e';msg.textContent='กรอกรหัสผ่านเดิมและใหม่ให้ครบ';return;}
  if(nw!==nw2){msg.style.color='#b3261e';msg.textContent='รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน';return;}
  msg.style.color='var(--ink-soft)';msg.textContent='กำลังบันทึก...';
  try{
    const r=await API.get({action:'changePassword',current:cur,next:nw,token:getToken()});
    if(r&&r.ok){msg.style.color='var(--green)';msg.textContent='เปลี่ยนรหัสผ่านสำเร็จ ✓';
      toast('เปลี่ยนรหัสผ่านแล้ว');setTimeout(()=>pwdModal.classList.remove('show'),900);}
    else if(r&&/token|อนุญาต/.test(r.error||'')){pwdModal.classList.remove('show');needRelogin();}
    else{msg.style.color='#b3261e';msg.textContent=(r&&r.error)||'เปลี่ยนไม่สำเร็จ';}
  }catch(e){msg.style.color='#b3261e';msg.textContent='เชื่อมต่อไม่ได้: '+e.message;}
};

// ====== เริ่มต้น: ถ้ามี token ในเซสชันนี้ ข้ามหน้ารหัสผ่าน ======
if(getToken()) enterApp();
</script>
</body></html>
